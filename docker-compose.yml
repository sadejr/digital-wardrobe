services:
  db:
    image: postgres:17
    container_name: digital-wardrobe-db
    environment:
      POSTGRES_DB: digitalwardrobe
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: digital-wardrobe-app
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=digitalwardrobe;Username=wardrobe;Password=${POSTGRES_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  dbdata:
services:
  db:
    image: postgres:17
    container_name: digital-wardrobe-db
    environment:
      POSTGRES_DB: digitalwardrobe
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe -d digitalwardrobe"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: digital-wardrobe-app
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=digitalwardrobe;Username=wardrobe;Password=${POSTGRES_PASSWORD}"
      Database__ApplyMigrationsOnStartup: "true"
      Storage__PhotosPath: /app/photos
      Registration__Enabled: ${REGISTRATION_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - photos:/app/photos

volumes:
  dbdata:
  photos: